<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dr. Tatiana Dib Schwellinger | Select Language</title>
  <meta name="description" content="Psychologist & Doctor in Neuroscience. Please select your preferred language.">
  
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            calypso: { 50:'#F0EDF7',100:'#DDD6EE',200:'#C1B3DE',300:'#A98FCE',400:'#8E6FBE',500:'#7B5EAD',600:'#6A4D9C',700:'#573D8A',800:'#452E75',900:'#321F5E',950:'#1E1242' },
            purple:  { 50:'#F5EEF8',100:'#E8DAEF',200:'#D2B4DE',300:'#C39BD3',400:'#BB8FCE',500:'#9B59B6',600:'#7B2D8E',700:'#6C3483',800:'#4A1259',900:'#2C0735',950:'#1A0420' }
          },
          fontFamily: { heading:['Oswald','sans-serif'], body:['Inter','sans-serif'] }
        }
      }
    }
  </script>
  
  <!-- Google Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@300;400;500;600&display=swap" rel="stylesheet">
  
  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>

  <style>
    body { 
      font-family: 'Inter', sans-serif; 
      overflow: hidden; 
    }
    h1, h2, h3 { 
      font-family: 'Oswald', sans-serif; 
    }

    /* Subtle animated background gradient */
    .bg-animated {
      background: linear-gradient(-45deg, #1A0420, #321F5E, #1E1242, #2C0735);
      background-size: 400% 400%;
      animation: gradientBG 15s ease infinite;
    }

    @keyframes gradientBG {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }

    /* Fade in animation */
    .fade-in {
      opacity: 0;
      transform: translateY(20px);
      animation: fadeInUp 1s cubic-bezier(0.22, 1, 0.36, 1) forwards;
    }
    .fade-in-delay-1 { animation-delay: 0.2s; }
    .fade-in-delay-2 { animation-delay: 0.4s; }
    .fade-in-delay-3 { animation-delay: 0.6s; }

    @keyframes fadeInUp {
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    /* Button hover glow */
    .lang-btn {
      transition: all 0.4s cubic-bezier(0.22, 1, 0.36, 1);
    }
    .lang-btn:hover {
      transform: translateY(-4px);
      box-shadow: 0 15px 40px -10px rgba(123, 94, 173, 0.5);
    }
  </style>
</head>
<body class="bg-animated text-white min-h-screen flex flex-col items-center justify-center relative">

  <!-- Decorative subtle background elements -->
  <div class="absolute top-0 left-0 w-full h-full overflow-hidden pointer-events-none">
    <div class="absolute top-1/4 left-1/4 w-96 h-96 bg-calypso-500/10 rounded-full blur-3xl"></div>
    <div class="absolute bottom-1/4 right-1/4 w-96 h-96 bg-purple-500/10 rounded-full blur-3xl"></div>
  </div>

  <!-- Main Content -->
  <main class="relative z-10 text-center px-6 max-w-2xl mx-auto">
    
    <!-- Logo / Icon -->
    <div class="fade-in mb-8 flex justify-center">
      <div class="w-20 h-20 rounded-2xl bg-gradient-to-br from-calypso-500 to-purple-500 flex items-center justify-center shadow-2xl shadow-calypso-500/20">
        <i data-lucide="brain" class="w-10 h-10 text-white"></i>
      </div>
    </div>

    <!-- Name & Title -->
    <h1 class="fade-in fade-in-delay-1 font-heading text-4xl md:text-6xl font-medium tracking-tight leading-tight mb-4">
      DRA. TATIANA DIB<br>
      <span class="text-transparent bg-clip-text bg-gradient-to-r from-calypso-300 to-purple-300">SCHWELLINGER</span>
    </h1>
    
    <p class="fade-in fade-in-delay-2 text-white/60 text-lg md:text-xl font-light tracking-wide mb-12">
      Psicóloga & Doctora en Neurociencias<br>
      <span class="text-base text-white/40">Psychologist & Doctor in Neuroscience</span>
    </p>

    <!-- Language Selection -->
    <div class="fade-in fade-in-delay-3 flex flex-col sm:flex-row items-center justify-center gap-6 w-full">
      
      <!-- English Button -->
      <a href="indexeng.html" class="lang-btn group w-full sm:w-64 px-8 py-5 rounded-2xl bg-white/5 border border-white/10 backdrop-blur-sm flex items-center justify-center gap-4 hover:bg-white/10 hover:border-calypso-400/50">
        <i data-lucide="globe" class="w-6 h-6 text-calypso-300 group-hover:scale-110 transition-transform"></i>
        <div class="text-left">
          <span class="block text-sm text-white/50 font-medium tracking-wider">SELECT LANGUAGE</span>
          <span class="block text-xl font-heading font-medium tracking-wide text-white">English</span>
        </div>
        <i data-lucide="arrow-right" class="w-5 h-5 text-white/30 group-hover:text-calypso-300 group-hover:translate-x-1 transition-all ml-auto"></i>
      </a>

      <!-- Spanish Button -->
      <a href="indexesp.html" class="lang-btn group w-full sm:w-64 px-8 py-5 rounded-2xl bg-white/5 border border-white/10 backdrop-blur-sm flex items-center justify-center gap-4 hover:bg-white/10 hover:border-purple-400/50">
        <i data-lucide="globe" class="w-6 h-6 text-purple-300 group-hover:scale-110 transition-transform"></i>
        <div class="text-left">
          <span class="block text-sm text-white/50 font-medium tracking-wider">SELECCIONAR IDIOMA</span>
          <span class="block text-xl font-heading font-medium tracking-wide text-white">Español</span>
        </div>
        <i data-lucide="arrow-right" class="w-5 h-5 text-white/30 group-hover:text-purple-300 group-hover:translate-x-1 transition-all ml-auto"></i>
      </a>

    </div>

    <!-- Footer Note -->
    <p class="fade-in fade-in-delay-3 mt-16 text-xs text-white/20 tracking-wider">
      VIÑA DEL MAR, CHILE
    </p>
  </main>

  <script>
    // Initialize Lucide icons
    lucide.createIcons();
  </script>
</body>
</html>
